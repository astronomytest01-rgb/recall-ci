name: Recall
options:
  bundleIdPrefix: local.recall
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Recall:
    type: application
    platform: iOS
    sources:
      - path: Recall
        excludes:
          - "Packs/**"
      - path: Recall/Packs
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.recall.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Recall
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  RecallTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RecallTests]
    dependencies:
      - target: Recall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Recall.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Recall"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RecallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RecallUITests]
    dependencies:
      - target: Recall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Recall
schemes:
  Recall:
    build:
      targets:
        Recall: all
        RecallTests: [test]
        RecallUITests: [test]
    test:
      targets: [RecallTests, RecallUITests]
